<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Painel Projeto Rural</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: caderno de campo — barra superior com abas, conteúdo em largura confortável, quadro kanban com rolagem lateral */
:root{
  --bg:#F2F4EE; --surface:#FBFCF8; --sunk:#E8ECE2; --line:#D6DCCD; --fg:#1E2820; --muted:#5D6A5E;
  --accent:#36633A; --accent-soft:#E1EBDC; --ochre:#A97A1F; --ochre-soft:#F3E7C9;
  --good:#2F7A3B; --warn:#B07A12; --bad:#A63A24; --bad-soft:#F6E0DA;
  --f-display:"Familjen Grotesk",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141A15; --surface:#1B231C; --sunk:#111611; --line:#2F3A30; --fg:#E4EADF; --muted:#9AA799;
  --accent:#8CC48A; --accent-soft:#233325; --ochre:#E0B657; --ochre-soft:#3A3120;
  --good:#7CCB86; --warn:#E3B04F; --bad:#F08B70; --bad-soft:#3A221C; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body);padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px}
.brand{font:700 1.05rem var(--f-display);display:flex;align-items:center;gap:8px}
.brand i{width:10px;height:10px;border-radius:50%;background:var(--ochre);display:inline-block}
nav.tabs{display:flex;gap:4px;flex:1 1 auto;overflow-x:auto}
nav.tabs button{background:none;border:0;border-radius:6px;padding:7px 12px;font:600 .92rem var(--f-display);color:var(--muted);cursor:pointer;white-space:nowrap}
nav.tabs button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.who{font-size:.85rem;color:var(--muted);display:flex;align-items:center;gap:8px}
.demo-flag{font:500 .72rem var(--f-mono);background:var(--ochre-soft);color:var(--ochre);padding:3px 8px;border-radius:4px}
main{padding-block:22px 60px}
h1{font:700 1.6rem/1.2 var(--f-display);margin:0 0 4px;letter-spacing:-.01em;text-wrap:balance}
h2{font:700 1.15rem/1.25 var(--f-display);margin:0 0 10px;text-wrap:balance}
h3{font:600 1rem var(--f-display);margin:0 0 6px}
.lead{color:var(--muted);margin:0 0 18px;max-width:70ch}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.stat .k{font:500 .75rem var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.stat .v{font:700 1.5rem var(--f-display);margin-top:4px;font-variant-numeric:tabular-nums}
.stat .s{font-size:.85rem;color:var(--muted)}
.neg{color:var(--bad)} .pos{color:var(--good)}
.alerts{display:grid;gap:8px}
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:8px;background:var(--sunk);font-size:.92rem}
.alert b.dot{width:8px;height:8px;border-radius:50%;flex:0 0 8px;margin-top:7px;background:var(--warn)}
.alert.bad b.dot{background:var(--bad)} .alert.ok b.dot{background:var(--good)}
.btn{background:var(--accent);color:var(--surface);border:0;border-radius:7px;padding:8px 14px;font:600 .92rem var(--f-display);cursor:pointer}
.btn.ghost{background:none;color:var(--accent);border:1px solid var(--line)}
.btn.danger{background:none;color:var(--bad);border:1px solid var(--line)}
.btn:focus-visible,nav.tabs button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
input[type=text],input[type=number],input[type=date],input[type=month],input[type=email],input[type=password],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%}
textarea{min-height:70px;resize:vertical}
label.f{display:grid;gap:4px;font-size:.85rem;color:var(--muted)}
label.f span{font-weight:700;color:var(--fg)}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
/* Plano */
.fase{display:grid;grid-template-columns:minmax(150px,220px) 1fr;gap:14px;padding:14px 0;border-top:1px solid var(--line)}
.fase:first-of-type{border-top:0}
.fase .n{font:600 1rem var(--f-display)} .fase .d{font-size:.85rem;color:var(--muted)}
.fase.atual{background:var(--accent-soft);border-radius:8px;padding:14px;border:0}
.pill{display:inline-block;font:600 .72rem var(--f-display);padding:2px 8px;border-radius:99px;background:var(--sunk);color:var(--muted)}
.pill.on{background:var(--accent);color:var(--surface)}
.gate{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:4px}
.gate label{display:flex;gap:8px;align-items:flex-start;font-size:.92rem;cursor:pointer}
.gate input{margin-top:4px}
@media (max-width:640px){.fase{grid-template-columns:1fr}}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:.85rem;font-variant-numeric:tabular-nums}
th,td{padding:7px 9px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font:600 .78rem var(--f-display);color:var(--muted);background:var(--sunk);position:sticky;top:0}
td:first-child,th:first-child{text-align:left}
tr.hl td{background:var(--ochre-soft)}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:.82rem;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
/* Quadro */
.board{display:grid;grid-template-columns:repeat(4,minmax(250px,1fr));gap:12px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--sunk);border-radius:10px;padding:10px;min-height:200px;display:flex;flex-direction:column;gap:8px}
.col.drop{outline:2px dashed var(--accent);outline-offset:-4px}
.col h3{display:flex;justify-content:space-between;font-size:.92rem;margin:2px 4px 4px}
.col h3 small{font:500 .78rem var(--f-mono);color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;cursor:grab;display:grid;gap:6px}
.card .t{font-weight:700;line-height:1.3}
.card .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:.78rem}
.tag{padding:1px 7px;border-radius:4px;background:var(--sunk);color:var(--muted);font-weight:700}
.tag.Operacional{background:#E3ECD9;color:#3D5B22}.tag.Comercial{background:#F3E7C9;color:#7A5712}.tag.Regularização{background:#E2E5F1;color:#3C4775}.tag.Financeiro{background:#F0DFDA;color:#7E3A26}.tag.Gestão{background:#E6E6E0;color:#4B4B40}
@media (prefers-color-scheme:dark){.tag.Operacional{background:#27351F;color:#B6D69A}.tag.Comercial{background:#3A3120;color:#E8C77E}.tag.Regularização{background:#252A3E;color:#AEB8E6}.tag.Financeiro{background:#3A241E;color:#F0A88F}.tag.Gestão{background:#2C2C27;color:#C9C9BC}}
.due{color:var(--muted)} .due.late{color:var(--bad);font-weight:700}
.resp{margin-left:auto;font-weight:700;color:var(--accent)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filters select{width:auto}
/* Caixa */
.ent{color:var(--good)} .sai{color:var(--bad)}
td .x{background:none;border:0;color:var(--muted);cursor:pointer;font-size:1rem}
/* Modal */
dialog{border:0;border-radius:12px;padding:0;max-width:560px;width:calc(100% - 32px);background:var(--surface);color:var(--fg)}
dialog::backdrop{background:rgba(10,15,10,.45)}
dialog form{padding:18px;display:grid;gap:12px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:.9rem;z-index:50}
/* Login */
.login{max-width:380px;margin:12vh auto;display:grid;gap:12px}
.empty{padding:24px;text-align:center;color:var(--muted)}
.hint{font-size:.82rem;color:var(--muted)}
/* Finanças */
.seg{display:inline-flex;background:var(--sunk);border-radius:8px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:7px 14px;border-radius:6px;font:600 .9rem var(--f-display);color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--accent)}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.bar{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.bar i.warn{background:var(--warn)} .bar i.bad{background:var(--bad)}
.catrow{display:grid;grid-template-columns:minmax(110px,1.1fr) 2fr minmax(90px,auto);gap:10px;align-items:center;font-size:.88rem;padding:5px 0}
.catrow .r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.health{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.hcard{border-radius:10px;padding:14px;border:1px solid var(--line);background:var(--surface);display:grid;gap:4px}
.hcard .k{font:500 .75rem var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.hcard .v{font:700 1.35rem var(--f-display);font-variant-numeric:tabular-nums}
.hcard .lvl{font:600 .75rem var(--f-display);text-transform:uppercase;letter-spacing:.05em}
.lvl.good{color:var(--good)} .lvl.warn{color:var(--warn)} .lvl.bad{color:var(--bad)}
.hcard.bad{border-color:var(--bad)} .hcard.warn{border-color:var(--warn)}
.paid{color:var(--good);font-weight:700}
.btn.sm{padding:4px 10px;font-size:.82rem}
tr.late td{background:var(--bad-soft)}
.linkbtn{background:none;border:0;padding:0;color:var(--fg);font:inherit;text-align:left;cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}
.pill.warnp{background:var(--ochre-soft);color:var(--ochre)}
@media (max-width:640px){.hide-sm{display:none}}
.note{font-size:.85rem;color:var(--muted);border-left:3px solid var(--ochre);padding:4px 0 4px 10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
/* ===================================================================

   Enquanto apiKey for "COLE_AQUI", o painel roda em MODO DEMONSTRAÇÃO:
   tudo fica salvo só neste navegador (localStorage).
   =================================================================== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBPmAFnLUP-Q_izzByKYfjZ2Xy5UQWeTek",
  authDomain: "projeto-rural-d850b.firebaseapp.com",

const VERSAO = "v4-2026-11-05";

/* ===================== utilidades ===================== */
const DEMO = !FIREBASE_CONFIG.apiKey || FIREBASE_CONFIG.apiKey === "COLE_AQUI" || typeof firebase === "undefined";
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const brl = n => (Number(n) || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL", maximumFractionDigits: 0 });
const brl2 = n => (Number(n) || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
const num = (n, d = 0) => (Number(n) || 0).toLocaleString("pt-BR", { maximumFractionDigits: d, minimumFractionDigits: d });
const hoje = (dias = 0) => { const d = new Date(Date.now() + dias * 864e5); return new Date(d.getTime() - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); };
const MESES = ["jan", "fev", "mar", "abr", "mai", "jun", "jul", "ago", "set", "out", "nov", "dez"];
const rotuloMes = ym => { const [y, m] = ym.split("-").map(Number); return `${MESES[m - 1]}/${String(y).slice(2)}`; };
const somaMes = (ym, k) => { let [y, m] = ym.split("-").map(Number); m += k; y += Math.floor((m - 1) / 12); m = ((m - 1) % 12 + 12) % 12 + 1; return `${y}-${String(m).padStart(2, "0")}`; };
function toast(msg) { document.querySelectorAll(".toast").forEach(x => x.remove()); const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); }

/* ===================== camada de dados ===================== */
function criarDB() {
  if (DEMO) {
    const KEY = "projeto-rural-demo-v1";
    let data; try { data = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { data = {}; }
    const subs = {};
    const save = () => { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {} };
    const list = c => Object.entries(data[c] || {}).map(([id, v]) => ({ id, ...v }));
    const emit = c => (subs[c] || []).forEach(fn => fn(list(c)));
    return {
      sub(c, fn) { (subs[c] = subs[c] || []).push(fn); fn(list(c)); return () => { subs[c] = subs[c].filter(f => f !== fn); }; },
      async add(c, v) { const id = Math.random().toString(36).slice(2, 11); (data[c] = data[c] || {})[id] = v; save(); emit(c); return id; },
      async set(c, id, v) { (data[c] = data[c] || {})[id] = v; save(); emit(c); },
      async update(c, id, v) { data[c][id] = { ...data[c][id], ...v }; save(); emit(c); },
      async remove(c, id) { delete (data[c] || {})[id]; save(); emit(c); },
      async batchAdd(c, arr) { for (const v of arr) { const id = Math.random().toString(36).slice(2, 11); (data[c] = data[c] || {})[id] = v; } save(); emit(c); }
    };
  }
  const fs = firebase.firestore();
  return {
    sub(c, fn) { return fs.collection(c).limit(2000).onSnapshot(s => fn(s.docs.map(d => ({ id: d.id, ...d.data() }))), e => toast("Sem acesso aos dados: " + e.code)); },
    async add(c, v) { return (await fs.collection(c).add(v)).id; },
    async set(c, id, v) { await fs.collection(c).doc(id).set(v); },
    async update(c, id, v) { await fs.collection(c).doc(id).update(v); },
    async remove(c, id) { await fs.collection(c).doc(id).delete(); },
    async batchAdd(c, arr) { const b = fs.batch(); arr.forEach(v => b.set(fs.collection(c).doc(), v)); await b.commit(); }
  };
}

/* ===================== projeção ===================== */
function projetar(plano) {
  const P = plano.premissas, out = [];
  const [y0, m0] = P.inicio.split("-").map(Number);
  const idx = s => { const [y, m] = s.split("-").map(Number); return (y - y0) * 12 + (m - m0); };
  const lotes = (plano.lotes || []).filter(l => l.mes && l.qtd > 0).map(l => ({ ...l, i: idx(l.mes) }));
  const metaReserva = P.despesasCasa * P.reservaMeses;
  let caixa = P.capitalProjeto, reserva = P.reservaInicial;
  for (let i = 0; i < 24; i++) {
    let aves = 0, invest = 0, recria = 0;
    for (const l of lotes) {
      if (i === l.i) invest += l.qtd * (P.pintainha + P.instalacaoAve);
      if (i >= l.i && i < l.i + P.mesesRecria) recria += l.qtd * P.recriaKg * P.racaoKg / P.mesesRecria;
      if (i >= l.i + P.mesesRecria) aves += l.qtd * (1 - P.mortalidade / 100);
    }
    const dz = aves * 30 * (P.postura / 100) / 12;
    const receita = dz * P.preco;
    const custo = aves * (P.consumoG / 1000 * 30 * P.racaoKg + P.sanidadeAve) + dz * P.embalagemDz + (aves > 0 ? P.transporteMes : 0) + recria;
    const resultado = receita - custo;
    const sogros = resultado > 0 ? resultado * P.pctSogros / 100 : 0;
    const liquido = resultado - sogros;
    const sobra = P.rendaCasal - P.despesasCasa;
    const paraReserva = sobra > 0 && reserva < metaReserva ? Math.min(sobra * P.pctReserva / 100, metaReserva - reserva) : 0;
    const aporte = sobra - paraReserva;
    reserva += paraReserva;
    caixa += aporte + liquido - invest;
    out.push({ mes: somaMes(P.inicio, i), aves, dz, receita, custo, resultado, sogros, liquido, invest, aporte, caixa, reserva });
  }
  return out;
}
function margemPorAve(P) {
  const dzAve = 30 * (P.postura / 100) / 12;
  return dzAve * P.preco - (P.consumoG / 1000 * 30 * P.racaoKg + P.sanidadeAve) - dzAve * P.embalagemDz;
}
function visao5anos(plano) {
  const P = plano.premissas, m = margemPorAve(P);
  return (plano.anos || []).map(a => {
    const vivos = a.aves * (1 - P.mortalidade / 100);
    const bruto = vivos * m - (a.aves > 0 ? P.transporteMes * Math.max(1, Math.ceil(a.aves / 400)) : 0) + Number(a.outras || 0);
    const casal = bruto > 0 ? bruto * (1 - P.pctSogros / 100) : bruto;
    return { ...a, porMes: casal, porAno: casal * 12, atinge: casal >= P.metaRenda };
  });
}

function graficoCaixa(proj) {
  const W = 760, H = 240, L = 64, R = 16, T = 16, B = 34;
  const vals = proj.flatMap(r => [r.caixa, r.reserva, r.liquido]);
  let lo = Math.min(0, ...vals), hi = Math.max(...vals); if (hi === lo) hi = lo + 1;
  const step = Math.pow(10, Math.floor(Math.log10((hi - lo) / 4)));
  const nice = [1, 2, 2.5, 5, 10].map(k => k * step).find(s => (hi - lo) / s <= 5) || step * 10;
  lo = Math.floor(lo / nice) * nice; hi = Math.ceil(hi / nice) * nice;
  const X = i => L + i * (W - L - R) / (proj.length - 1), Y = v => T + (hi - v) * (H - T - B) / (hi - lo);
  const line = (k, c, w) => `<polyline fill="none" stroke="${c}" stroke-width="${w}" points="${proj.map((r, i) => `${X(i).toFixed(1)},${Y(r[k]).toFixed(1)}`).join(" ")}"/>`;
  let ticks = ""; for (let v = lo; v <= hi + 1e-6; v += nice) ticks += `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"${v === 0 ? ' stroke-width="1.5"' : ""}/><text x="${L - 8}" y="${Y(v) + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${(v / 1000).toLocaleString("pt-BR")} mil</text>`;
  const xl = proj.map((r, i) => i % 3 === 0 ? `<text x="${X(i)}" y="${H - 12}" text-anchor="middle" font-size="11" fill="var(--muted)">${rotuloMes(r.mes)}</text>` : "").join("");
  const last = proj.length - 1;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Caixa do projeto, reserva e renda rural nos próximos 24 meses">${ticks}${xl}${line("reserva", "var(--ochre)", 2)}${line("liquido", "var(--muted)", 1.5)}${line("caixa", "var(--accent)", 2.5)}<circle cx="${X(last)}" cy="${Y(proj[last].caixa)}" r="4" fill="var(--accent)"/></svg>`;
}

/* ===================== finanças pessoais ===================== */
const PESSOAS_FIN = ["Marco", "Marina"];
const CAT_APORTE = "Projeto rural (aporte)";
const CAT_RESERVA = "Reserva / investimento";
const CAT_DESP = ["Moradia", "Contas da casa", "Alimentação", "Transporte", "Filhos", "Saúde", "Educação", "Celular e internet", "Academia e bem-estar", "Lazer", "Vestuário", "Impostos e MEI", "Dívidas e parcelas", CAT_APORTE, CAT_RESERVA, "Outros"];
const CAT_REC = ["Salário / contrato", "Renda extra", "13º / férias", "Outras entradas"];
const FORMAS = ["Pix / débito", "Dinheiro", "Boleto", "Cartão da mãe", "Cartão próprio"];
const TIPOS_SALDO = ["Poupança", "Conta corrente", "Investimento", "Reserva de emergência", "Dívida"];
const FIN_PADRAO = { orcamentos: { Marco: {}, Marina: {} }, metaReservaMeses: 3 };

const ativaNoMes = (f, m) => f.ativa !== false && (!f.inicio || f.inicio <= m) && (!f.fim || f.fim >= m);
const pagFixa = (f, m) => S.finLanc.find(l => l.fixaId === f.id && l.mes === m);
const soma = arr => arr.reduce((a, x) => a + (Number(x) || 0), 0);
const finCfg = () => S.finCfg || FIN_PADRAO;

function resumoPessoa(p, m) {
  const fixas = S.finFixas.filter(f => f.pessoa === p && ativaNoMes(f, m));
  const vari = S.finLanc.filter(l => l.pessoa === p && l.mes === m && !l.fixaId);
  const val = f => { const l = pagFixa(f, m); return Number(l ? l.valor : f.valor) || 0; };
  const recF = soma(fixas.filter(f => f.tipo === "receita").map(val));
  const despF = soma(fixas.filter(f => f.tipo === "despesa").map(val));
  const recV = soma(vari.filter(l => l.tipo === "receita").map(l => l.valor));
  const despV = soma(vari.filter(l => l.tipo === "despesa").map(l => l.valor));
  const pagoF = soma(fixas.filter(f => f.tipo === "despesa" && pagFixa(f, m)).map(val));
  const porCat = {}, porCatV = {};
  fixas.filter(f => f.tipo === "despesa").forEach(f => porCat[f.categoria] = (porCat[f.categoria] || 0) + val(f));
  vari.filter(l => l.tipo === "despesa").forEach(l => { const v = Number(l.valor) || 0; porCat[l.categoria] = (porCat[l.categoria] || 0) + v; porCatV[l.categoria] = (porCatV[l.categoria] || 0) + v; });
  const cartaoMae = soma(S.finLanc.filter(l => l.pessoa === p && l.mes === m && l.tipo === "despesa" && l.forma === "Cartão da mãe").map(l => l.valor));
  const aporte = porCat[CAT_APORTE] || 0, reservaAp = porCat[CAT_RESERVA] || 0;
  const renda = recF + recV, desp = despF + despV;
  return { fixas, vari, renda, desp, despF, despV, pago: pagoF + despV, porCat, porCatV, cartaoMae, aporte, reservaAp, consumo: desp - aporte - reservaAp, saldo: renda - desp };
}

function viewPessoa(p) {
  const m = S.finMes, r = resumoPessoa(p, m), h = hoje(), mesAtual = h.slice(0, 7) === m, dH = Number(h.slice(8));
  const orc = (finCfg().orcamentos || {})[p] || {};
  const fixasOrd = r.fixas.slice().sort((a, b) => (a.tipo === b.tipo ? 0 : a.tipo === "receita" ? -1 : 1) || (a.dia || 99) - (b.dia || 99));
  const linha = f => {
    const l = pagFixa(f, m), desp = f.tipo === "despesa";
    const atras = !l && desp && mesAtual && f.dia && f.dia < dH;
    const vence = !l && desp && mesAtual && f.dia && f.dia >= dH && f.dia - dH <= 3;
    const semValor = !Number(f.valor);
    return `<tr class="${atras ? "late" : ""}"><td>${f.dia ? String(f.dia).padStart(2, "0") : "—"}</td>
      <td style="text-align:left"><button type="button" class="linkbtn" data-efixa="${f.id}">${esc(f.descricao)}</button>${vence ? ` <span class="pill warnp">${f.dia === dH ? "vence hoje" : `vence em ${f.dia - dH} dia(s)`}</span>` : ""}${atras ? ` <span class="pill warnp">atrasada</span>` : ""}${semValor ? ` <span class="pill warnp">informar valor</span>` : ""}${f.fim ? ` <span class="hint">até ${rotuloMes(f.fim)}</span>` : ""}</td>
      <td style="text-align:left" class="hide-sm">${esc(f.categoria)}</td>
      <td class="${desp ? "" : "ent"}">${desp ? "" : "+ "}${brl2(l ? l.valor : f.valor)}</td>
      <td>${l ? `<span class="paid">${desp ? "Pago" : "Recebido"} ✓</span> <button type="button" class="x" data-unpay="${l.id}" aria-label="Desfazer">↺</button>` : `<button type="button" class="btn sm ghost" data-pay="${f.id}">${desp ? "Paguei" : "Recebi"}</button>`}</td></tr>`;
  };
  const cats = Object.entries(r.porCat).sort((a, b) => b[1] - a[1]);
  const maxCat = Math.max(1, ...cats.map(c => c[1]));
  const orcCats = [...new Set([...Object.keys(orc).filter(k => Number(orc[k]) > 0), ...Object.keys(r.porCatV)])].filter(c => c !== CAT_APORTE && c !== CAT_RESERVA);
  const vari = r.vari.slice().sort((a, b) => a.data < b.data ? 1 : -1);
  return `
  <div class="grid g4" style="margin-top:14px">
    <div class="panel stat"><div class="k">Entradas do mês</div><div class="v pos">${brl(r.renda)}</div><div class="s">${p}</div></div>
    <div class="panel stat"><div class="k">Saídas previstas</div><div class="v">${brl(r.desp)}</div><div class="s">Fixas ${brl(r.despF)} · dia a dia ${brl(r.despV)}</div></div>
    <div class="panel stat"><div class="k">Já pago</div><div class="v">${brl(r.pago)}</div><div class="s">Falta pagar ${brl(Math.max(0, r.desp - r.pago))}</div></div>
    <div class="panel stat"><div class="k">Sobra prevista</div><div class="v ${r.saldo < 0 ? "neg" : "pos"}">${brl(r.saldo)}</div><div class="s">${r.renda ? `Fixas usam ${num(r.despF / r.renda * 100)}% da renda` : "Cadastre a renda"}</div></div>
  </div>
  ${r.cartaoMae ? `<div class="alert bad" style="margin-top:14px"><b class="dot"></b><div>Neste mês ${p === "Marco" ? "você usou" : "foi usado"} <b>${brl2(r.cartaoMae)}</b> no cartão da mãe. Esse valor precisa ser devolvido a ela e já está contado nas saídas.</div></div>` : ""}

  <div class="panel" style="margin-top:14px">
    <div class="row"><h2 style="margin:0">Contas fixas de ${rotuloMes(m)}</h2><span class="spacer"></span><button class="btn ghost" type="button" id="novaFixa">Nova conta fixa</button></div>
    <p class="hint" style="margin:6px 0 10px">Cadastradas uma vez, aparecem todo mês. Clique no nome para editar. Marque "Paguei" quando pagar.</p>
    ${fixasOrd.length ? `<div class="tbl-wrap"><table><thead><tr><th>Dia</th><th style="text-align:left">Conta</th><th style="text-align:left" class="hide-sm">Categoria</th><th>Valor</th><th></th></tr></thead><tbody>${fixasOrd.map(linha).join("")}</tbody></table></div>` : `<div class="empty">Nenhuma conta fixa para ${esc(p)} neste mês.</div>`}
  </div>

  <div class="grid g2" style="margin-top:14px">
    <form class="panel" id="fV"><h2>Gasto do dia a dia</h2>
      <div class="form-grid">
        <label class="f"><span>Tipo</span><select id="vTipo"><option value="despesa">Saída</option><option value="receita">Entrada</option></select></label>
        <label class="f"><span>Valor (R$)</span><input type="number" id="vValor" step="0.01" min="0" required inputmode="decimal"></label>
        <label class="f"><span>Categoria</span><select id="vCat">${CAT_DESP.map(c => `<option>${c}</option>`).join("")}</select></label>
        <label class="f"><span>Data</span><input type="date" id="vData" value="${mesAtual ? h : m + "-01"}" required></label>
        <label class="f"><span>Pagou com</span><select id="vForma">${FORMAS.map(c => `<option>${c}</option>`).join("")}</select></label>
      </div>
      <label class="f" style="margin-top:12px"><span>Descrição</span><input type="text" id="vDesc" placeholder="Ex.: mercado da semana"></label>
      <div class="row" style="margin-top:12px"><button class="btn" type="submit">Lançar</button><span class="hint">"${CAT_APORTE}" também entra no Caixa do projeto.</span></div>
    </form>
    <div class="panel"><div class="row"><h2 style="margin:0">Limites do dia a dia</h2><span class="spacer"></span><button class="btn ghost sm" type="button" id="editOrc">Definir limites</button></div>
      <p class="hint" style="margin:6px 0 10px">Quanto pode gastar por mês em cada categoria variável.</p>
      ${orcCats.length ? orcCats.map(c => { const g = r.porCatV[c] || 0, lim = Number(orc[c]) || 0, pct = lim ? g / lim * 100 : 100, cls = !lim ? "" : pct > 100 ? "bad" : pct > 80 ? "warn" : "";
        return `<div class="catrow"><div>${esc(c)}</div><div class="bar"><i class="${cls}" style="width:${Math.min(100, pct)}%"></i></div><div class="r">${brl(g)}${lim ? ` de ${brl(lim)}` : ""}</div></div>`; }).join("") : `<div class="empty">Sem limites definidos.</div>`}
    </div>
  </div>

  <div class="grid g2" style="margin-top:14px">
    <div class="panel"><h2>Lançamentos do dia a dia</h2>
      ${vari.length ? `<div class="tbl-wrap"><table><thead><tr><th>Data</th><th style="text-align:left">Descrição</th><th style="text-align:left">Categoria</th><th>Valor</th><th></th></tr></thead><tbody>
      ${vari.map(l => `<tr><td>${esc(l.data.split("-").reverse().slice(0, 2).join("/"))}</td><td style="text-align:left">${esc(l.descricao || "—")}</td><td style="text-align:left">${esc(l.categoria)}<br><span class="hint">${esc(l.forma || "")}</span></td><td class="${l.tipo === "receita" ? "ent" : "sai"}">${l.tipo === "receita" ? "+" : "−"} ${brl2(l.valor)}</td><td><button type="button" class="x" data-dlanc="${l.id}" aria-label="Excluir lançamento">×</button></td></tr>`).join("")}
      </tbody></table></div>` : `<div class="empty">Nenhum gasto lançado em ${rotuloMes(m)}.</div>`}
    </div>
    <div class="panel"><h2>Para onde foi o dinheiro</h2>
      ${cats.length ? cats.map(([c, v]) => `<div class="catrow"><div>${esc(c)}</div><div class="bar"><i style="width:${v / maxCat * 100}%"></i></div><div class="r">${brl(v)}${r.renda ? ` · ${num(v / r.renda * 100)}%` : ""}</div></div>`).join("") : `<div class="empty">Sem saídas neste mês.</div>`}
    </div>
  </div>`;
}

function bindPessoa(p) {
  const m = S.finMes;
  $("#novaFixa").addEventListener("click", () => abrirFixa(null, p));
  $("#editOrc").addEventListener("click", () => abrirOrc(p));
  document.querySelectorAll("[data-efixa]").forEach(b => b.addEventListener("click", () => abrirFixa(b.dataset.efixa, p)));
  document.querySelectorAll("[data-pay]").forEach(b => b.addEventListener("click", async () => {
    const f = S.finFixas.find(x => x.id === b.dataset.pay); if (!f) return;
    const h = hoje(), data = h.slice(0, 7) === m ? h : `${m}-${String(Math.min(28, f.dia || 1)).padStart(2, "0")}`;
    try { await addLanc({ fixaId: f.id, mes: m, pessoa: f.pessoa, tipo: f.tipo, categoria: f.categoria, descricao: f.descricao, valor: Number(f.valor) || 0, data, forma: f.forma || "Pix / débito", criadoEm: h }); toast(f.tipo === "despesa" ? "Marcado como pago." : "Marcado como recebido."); } catch (e) { toast("Não foi possível salvar."); }
  }));
  document.querySelectorAll("[data-unpay]").forEach(b => b.addEventListener("click", async () => { try { await removeLanc(b.dataset.unpay); toast("Desfeito."); } catch (e) { toast("Não foi possível desfazer."); } }));
  document.querySelectorAll("[data-dlanc]").forEach(b => b.addEventListener("click", async () => { if (await confirmar("Excluir este lançamento?")) { try { await removeLanc(b.dataset.dlanc); toast("Lançamento excluído."); } catch (e) { toast("Não foi possível excluir."); } } }));
  $("#vTipo").addEventListener("change", () => { $("#vCat").innerHTML = ($("#vTipo").value === "receita" ? CAT_REC : CAT_DESP).map(c => `<option>${c}</option>`).join(""); });
  $("#fV").addEventListener("submit", async e => {
    e.preventDefault();
    const data = $("#vData").value, valor = Number($("#vValor").value);
    if (!valor || !data) return;
    const v = { pessoa: p, tipo: $("#vTipo").value, valor, categoria: $("#vCat").value, data, mes: data.slice(0, 7), forma: $("#vForma").value, descricao: $("#vDesc").value.trim(), criadoEm: hoje(), autor: S.user?.email || "demo" };
    try { await addLanc(v); toast("Lançado."); } catch (err) { toast("Não foi possível lançar."); }
  });
}

function abrirFixa(id, pessoa) {
  const f = id ? S.finFixas.find(x => x.id === id) : { pessoa, tipo: "despesa", descricao: "", categoria: "Moradia", valor: "", dia: "", forma: "Pix / débito", inicio: S.finMes, fim: "", ativa: true };
  if (!f) return;
  const dlg = $("#dlg");
  const cats = t => (t === "receita" ? CAT_REC : CAT_DESP).map(c => `<option ${f.categoria === c ? "selected" : ""}>${c}</option>`).join("");
  dlg.innerHTML = `<form method="dialog" id="fF">
    <h2>${id ? "Editar conta fixa" : "Nova conta fixa"}</h2>
    <label class="f"><span>Nome</span><input type="text" id="xDesc" required value="${esc(f.descricao)}" placeholder="Ex.: Aluguel"></label>
    <div class="form-grid">
      <label class="f"><span>Pessoa</span><select id="xPes">${PESSOAS_FIN.map(p => `<option ${f.pessoa === p ? "selected" : ""}>${p}</option>`).join("")}</select></label>
      <label class="f"><span>Tipo</span><select id="xTipo"><option value="despesa" ${f.tipo === "despesa" ? "selected" : ""}>Saída</option><option value="receita" ${f.tipo === "receita" ? "selected" : ""}>Entrada</option></select></label>
      <label class="f"><span>Categoria</span><select id="xCat">${cats(f.tipo)}</select></label>
      <label class="f"><span>Valor por mês (R$)</span><input type="number" id="xVal" step="0.01" min="0" value="${esc(f.valor)}"></label>
      <label class="f"><span>Dia do vencimento</span><input type="number" id="xDia" min="1" max="31" value="${esc(f.dia || "")}"></label>
      <label class="f"><span>Paga com</span><select id="xForma">${FORMAS.map(c => `<option ${f.forma === c ? "selected" : ""}>${c}</option>`).join("")}</select></label>
      <label class="f"><span>Começa em</span><input type="month" id="xIni" value="${esc(f.inicio || "")}"></label>
      <label class="f"><span>Termina em (opcional)</span><input type="month" id="xFim" value="${esc(f.fim || "")}"></label>
    </div>
    <label class="row" style="gap:8px"><input type="checkbox" id="xAtiva" ${f.ativa !== false ? "checked" : ""}> Conta ativa</label>
    <div class="row">${id ? `<button type="button" class="btn danger" id="xDel">Excluir</button>` : ""}<span class="spacer"></span><button type="button" class="btn ghost" id="xCancel">Cancelar</button><button class="btn" type="submit">Salvar</button></div>
  </form>`;
  dlg.showModal();
  $("#xTipo").addEventListener("change", () => { $("#xCat").innerHTML = cats($("#xTipo").value); });
  $("#xCancel").addEventListener("click", () => dlg.close());
  if (id) $("#xDel").addEventListener("click", async () => { dlg.close(); if (await confirmar(`Excluir a conta fixa "${f.descricao}"? Os pagamentos já marcados continuam no histórico.`)) { try { await DB.remove("fin_fixas", id); toast("Conta excluída."); } catch (e) { toast("Não foi possível excluir."); } } });
  $("#fF").addEventListener("submit", async e => {
    e.preventDefault();
    const v = { pessoa: $("#xPes").value, tipo: $("#xTipo").value, descricao: $("#xDesc").value.trim(), categoria: $("#xCat").value, valor: Number($("#xVal").value) || 0, dia: Number($("#xDia").value) || null, forma: $("#xForma").value, inicio: $("#xIni").value || S.finMes, fim: $("#xFim").value || "", ativa: $("#xAtiva").checked, atualizadoEm: hoje() };
    if (!v.descricao) return;
    dlg.close();
    try { if (id) await DB.update("fin_fixas", id, v); else await DB.add("fin_fixas", { ...v, criadoEm: hoje() }); toast("Conta salva."); } catch (err) { toast("Não foi possível salvar."); }
  });
}

function abrirOrc(p) {
  const cfg = finCfg(), orc = (cfg.orcamentos || {})[p] || {};
  const lista = CAT_DESP.filter(c => ![CAT_APORTE, CAT_RESERVA, "Moradia", "Impostos e MEI", "Dívidas e parcelas"].includes(c));
  const dlg = $("#dlg");
  dlg.innerHTML = `<form method="dialog" id="fO"><h2>Limites do dia a dia · ${esc(p)}</h2><p class="hint">Deixe em branco a categoria sem limite.</p>
    <div class="form-grid">${lista.map((c, i) => `<label class="f"><span>${esc(c)}</span><input type="number" step="1" min="0" id="o_${i}" value="${esc(orc[c] || "")}"></label>`).join("")}</div>
    <div class="row"><span class="spacer"></span><button type="button" class="btn ghost" id="oCancel">Cancelar</button><button class="btn" type="submit">Salvar</button></div></form>`;
  dlg.showModal();
  $("#oCancel").addEventListener("click", () => dlg.close());
  $("#fO").addEventListener("submit", async e => {
    e.preventDefault();
    const novo = {}; lista.forEach((c, i) => { const v = Number($("#o_" + i).value); if (v > 0) novo[c] = v; });
    dlg.close();
    const orcamentos = { ...(cfg.orcamentos || {}), [p]: novo };
    try { await DB.set("config", "financas", { ...cfg, orcamentos }); toast("Limites salvos."); } catch (err) { toast("Não foi possível salvar."); }
  });
}

function nivel(v, bom, aviso, maiorMelhor = true) {
  if (maiorMelhor) return v >= bom ? "good" : v >= aviso ? "warn" : "bad";
  return v <= bom ? "good" : v <= aviso ? "warn" : "bad";
}
const ROTULO_NIVEL = { good: "Saudável", warn: "Atenção", bad: "Crítico" };

function dadosCasal(m) {
  const rs = PESSOAS_FIN.map(p => ({ p, ...resumoPessoa(p, m) }));
  const t = k => soma(rs.map(r => r[k]));
  const renda = t("renda"), desp = t("desp"), despF = t("despF"), aporte = t("aporte"), reservaAp = t("reservaAp"), consumo = t("consumo"), cartaoMae = t("cartaoMae");
  const sobra = renda - consumo;
  const saldos = S.finSaldos;
  const reserva = soma(saldos.filter(s => s.tipo === "Reserva de emergência").map(s => s.valor));
  const dividas = soma(saldos.filter(s => s.tipo === "Dívida").map(s => s.valor));
  const ativos = soma(saldos.filter(s => s.tipo !== "Dívida").map(s => s.valor));
  return { rs, renda, desp, despF, aporte, reservaAp, consumo, cartaoMae, sobra, reserva, dividas, ativos };
}

function viewCasal() {
  const m = S.finMes, d = dadosCasal(m), cfg = finCfg(), P = S.plano?.premissas || {};
  const metaMeses = Number(cfg.metaReservaMeses) || 3, metaRes = d.consumo * metaMeses;
  const taxa = d.renda ? d.sobra / d.renda * 100 : 0, pFix = d.renda ? d.despF / d.renda * 100 : 0, mesesRes = d.consumo ? d.reserva / d.consumo : 0;
  const ind = [
    ["Taxa de sobra", `${num(taxa)}%`, nivel(taxa, 15, 5), "Quanto da renda não vira consumo. Meta: 15% ou mais."],
    ["Contas fixas / renda", `${num(pFix)}%`, nivel(pFix, 50, 70, false), "Até 50% é confortável; acima de 70% qualquer imprevisto aperta."],
    ["Reserva de emergência", `${num(mesesRes, 1)} meses`, nivel(mesesRes, 3, 1), `Meta: ${metaMeses} meses de custo da casa (${brl(metaRes)}).`],
    ["Cartão da mãe no mês", brl(d.cartaoMae), d.cartaoMae <= 0 ? "good" : d.cartaoMae <= d.renda * 0.1 ? "warn" : "bad", "Compra no cartão de outra pessoa é dívida, mesmo sem juros."],
    ["Dívidas registradas", brl(d.dividas), d.dividas <= 0 ? "good" : d.dividas <= d.renda ? "warn" : "bad", "Some cartão, empréstimos e acordos em Saldos e dívidas."]
  ];
  const pct = Number(P.pctReserva) || 30;
  const sugRes = d.sobra > 0 ? (d.reserva < metaRes ? d.sobra * pct / 100 : 0) : 0;
  const sugProj = d.sobra > 0 ? d.sobra - sugRes : 0;
  const saldos = S.finSaldos.slice().sort((a, b) => (a.tipo === "Dívida") - (b.tipo === "Dívida") || (b.valor || 0) - (a.valor || 0));
  return `
  <div class="grid g4" style="margin-top:14px">
    <div class="panel stat"><div class="k">Renda do casal</div><div class="v pos">${brl(d.renda)}</div><div class="s">${d.rs.map(r => `${r.p} ${brl(r.renda)}`).join(" · ")}</div></div>
    <div class="panel stat"><div class="k">Custo da casa</div><div class="v">${brl(d.consumo)}</div><div class="s">Sem contar reserva e aportes</div></div>
    <div class="panel stat"><div class="k">Sobra do mês</div><div class="v ${d.sobra < 0 ? "neg" : "pos"}">${brl(d.sobra)}</div><div class="s">Já destinado: reserva ${brl(d.reservaAp)} · projeto ${brl(d.aporte)}</div></div>
    <div class="panel stat"><div class="k">Patrimônio líquido</div><div class="v ${d.ativos - d.dividas < 0 ? "neg" : ""}">${brl(d.ativos - d.dividas)}</div><div class="s">Guardado ${brl(d.ativos)} · dívidas ${brl(d.dividas)}</div></div>
  </div>

  ${d.rs.filter(r => r.renda > 0 && r.desp === 0).map(r => `<p class="note" style="margin-top:14px">${r.p} ainda não cadastrou nenhuma despesa. Os indicadores do casal ficam otimistas até isso ser feito.</p>`).join("")}
  <div class="panel" style="margin-top:14px"><h2>Saúde financeira</h2>
    <div class="health">${ind.map(([k, v, l, s]) => `<div class="hcard ${l}"><div class="k">${k}</div><div class="v">${v}</div><div class="lvl ${l}">${ROTULO_NIVEL[l]}</div><div class="hint">${s}</div></div>`).join("")}</div>
  </div>

  <div class="grid g2" style="margin-top:14px">
    <div class="panel"><h2>Quem paga o quê</h2>
      <div class="tbl-wrap"><table><thead><tr><th>Pessoa</th><th>Entradas</th><th>Fixas</th><th>Dia a dia</th><th>Sobra</th></tr></thead><tbody>
      ${d.rs.map(r => `<tr><td>${r.p}</td><td>${brl(r.renda)}</td><td>${brl(r.despF)}</td><td>${brl(r.despV)}</td><td class="${r.saldo < 0 ? "neg" : "pos"}">${brl(r.saldo)}</td></tr>`).join("")}
      <tr class="hl"><td><b>Casal</b></td><td>${brl(d.renda)}</td><td>${brl(d.despF)}</td><td>${brl(d.desp - d.despF)}</td><td class="${d.renda - d.desp < 0 ? "neg" : "pos"}">${brl(d.renda - d.desp)}</td></tr>
      </tbody></table></div>
      ${d.rs.some(r => r.saldo < 0) ? `<p class="note" style="margin-top:10px">${d.rs.filter(r => r.saldo < 0).map(r => r.p).join(" e ")} fecha o mês no negativo sozinho. A conta da casa só fecha com a renda do outro.</p>` : ""}
    </div>
    <div class="panel"><h2>Para onde vai a sobra</h2>
      ${d.sobra > 0 ? `<p class="hint">Regra do Plano: enquanto a reserva não chega a ${metaMeses} meses, ${pct}% da sobra vai para ela e o resto para o projeto.</p>
      <div class="tbl-wrap" style="margin-top:8px"><table><thead><tr><th>Destino</th><th>Sugerido</th><th>Feito no mês</th></tr></thead><tbody>
        <tr><td>Reserva de emergência</td><td>${brl(sugRes)}</td><td class="${d.reservaAp >= sugRes ? "pos" : ""}">${brl(d.reservaAp)}</td></tr>
        <tr><td>Projeto rural</td><td>${brl(sugProj)}</td><td class="${d.aporte >= sugProj ? "pos" : ""}">${brl(d.aporte)}</td></tr>
      </tbody></table></div>
      <p class="hint" style="margin-top:8px">Para registrar, lance uma saída com a categoria "${CAT_RESERVA}" ou "${CAT_APORTE}" na aba de quem pagou. O aporte entra sozinho no Caixa do projeto.</p>`
      : `<div class="alert bad"><b class="dot"></b><div>Não sobra dinheiro neste mês. Antes de investir no projeto, é preciso cortar gastos ou aumentar a renda.</div></div>`}
      <h3 style="margin-top:16px">Plano x realidade</h3>
      <div class="tbl-wrap"><table><thead><tr><th>Premissa do Plano</th><th>No Plano</th><th>Real em ${rotuloMes(m)}</th></tr></thead><tbody>
        <tr><td>Renda do casal</td><td>${brl(P.rendaCasal)}</td><td>${brl(d.renda)}</td></tr>
        <tr><td>Despesas da casa</td><td>${brl(P.despesasCasa)}</td><td>${brl(d.consumo)}</td></tr>
      </tbody></table></div>
      <div class="row" style="margin-top:10px"><button class="btn ghost" type="button" id="atuPlano">Atualizar o Plano com os números reais</button></div>
    </div>
  </div>

  <div class="grid g2" style="margin-top:14px">
    <div class="panel"><h2>Saldos e dívidas</h2>

function resumoTexto() {
  const meses = [somaMes(S.finMes, -2), somaMes(S.finMes, -1), S.finMes];
  const L = [`RESUMO FINANCEIRO — Painel Projeto Rural (gerado em ${hoje().split("-").reverse().join("/")})`, ""];
  for (const m of meses) {
    const d = dadosCasal(m);
    if (!d.renda && !d.desp) continue;
    L.push(`## ${rotuloMes(m)}`);
    d.rs.forEach(r => {
      L.push(`${r.p}: entradas ${brl2(r.renda)} | saídas ${brl2(r.desp)} (fixas ${brl2(r.despF)}, dia a dia ${brl2(r.despV)}) | sobra ${brl2(r.saldo)} | cartão da mãe ${brl2(r.cartaoMae)}`);
      const cats = Object.entries(r.porCat).sort((a, b) => b[1] - a[1]).map(([c, v]) => `${c} ${brl2(v)}`).join("; ");
      if (cats) L.push(`  por categoria: ${cats}`);
    });
    L.push(`Casal: renda ${brl2(d.renda)} | custo da casa ${brl2(d.consumo)} | sobra ${brl2(d.sobra)} | reserva ${brl2(d.reservaAp)} | aporte no projeto ${brl2(d.aporte)}`, "");
  }
  L.push("## Contas fixas cadastradas");
  S.finFixas.filter(f => f.ativa !== false).forEach(f => L.push(`- ${f.pessoa} · ${f.tipo === "receita" ? "entrada" : "saída"} · ${f.descricao} (${f.categoria}) ${brl2(f.valor)}${f.dia ? ` · dia ${f.dia}` : ""}${f.fim ? ` · até ${f.fim}` : ""} · ${f.forma || ""}`));
  L.push("", "## Saldos e dívidas");
  S.finSaldos.forEach(s => L.push(`- ${s.nome} (${s.pessoa}, ${s.tipo}): ${brl2(s.valor)}`));
  const o = finCfg().orcamentos || {};
  L.push("", "## Limites do dia a dia");
  PESSOAS_FIN.forEach(p => L.push(`- ${p}: ${Object.entries(o[p] || {}).map(([c, v]) => `${c} ${brl(v)}`).join("; ") || "nenhum"}`));
  return L.join("\n");
}

async function importarDados(txt) {
  const j = JSON.parse(txt);
  const fixas = Array.isArray(j.fixas) ? j.fixas : [], saldos = Array.isArray(j.saldos) ? j.saldos : [];
  if (!fixas.length && !saldos.length && !j.config) throw new Error("vazio");
  const ini = hoje().slice(0, 7);
  if (fixas.length) await DB.batchAdd("fin_fixas", fixas.map(f => ({ ativa: true, inicio: ini, fim: "", forma: "Pix / débito", dia: null, ...f, criadoEm: hoje() })));
  if (saldos.length) await DB.batchAdd("fin_saldos", saldos.map(s => ({ ...s, atualizadoEm: hoje() })));
  if (j.config) await DB.set("config", "financas", { ...finCfg(), ...j.config });
  return fixas.length + saldos.length;
}

const norm = s => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
const PALAVRAS_CAT = [
  ["Alimentação", ["mercado", "supermercado", "feira", "padaria", "acougue", "hortifruti", "lanche", "restaurante", "ifood", "almoco", "jantar", "cafe", "comida", "pizza", "alimentacao"]],

  ["Saúde", ["farmacia", "remedio", "medico", "consulta", "exame", "dentista", "hospital", "saude"]],
  ["Educação", ["escola", "curso", "livro", "faculdade", "educacao"]],
  ["Vestuário", ["roupa", "sapato", "tenis", "camisa", "calca", "vestuario"]],
  ["Lazer", ["cinema", "passeio", "bar", "show", "viagem", "festa", "presente", "lazer"]],
  ["Contas da casa", ["luz", "agua", "energia", "gas", "internet"]],
  ["Celular e internet", ["celular", "recarga", "chip"]],
  ["Academia e bem-estar", ["academia", "suplemento", "barbeiro", "cabelo", "salao"]],
  ["Moradia", ["aluguel", "condominio", "moradia"]],
  ["Impostos e MEI", ["mei", "imposto", "iptu", "ipva", "impostos"]],
  [CAT_APORTE, ["racao", "galinha", "galinhas", "pintinho", "pintainha", "projeto", "galinheiro", "tela", "sementes", "adubo"]],
  [CAT_RESERVA, ["reserva", "guardei", "poupei", "investi"]],
  ["Filhos", ["pensao", "bale", "jiu", "jiujitsu", "filhos", "maria", "luiz"]]
];
const temPalavra = (n, w) => new RegExp(`(^|[^a-z0-9])${w}([^a-z0-9]|$)`).test(n);
function acharCat(n) { for (const [c, ws] of PALAVRAS_CAT) if (ws.some(w => temPalavra(n, w))) return c; return null; }
function pessoaPadrao() {
  if (S.tab === "financas" && PESSOAS_FIN.includes(S.finAba)) return S.finAba;
  return norm(S.user?.email || "").startsWith("mmendex") ? "Marina" : "Marco";
}
const PALAVRAS_VAZIAS = new Set(["do", "da", "de", "dos", "e", "o", "a", "os", "as", "no", "na", "com", "para", "pra", "inclui", "conta", "contas", "paguei", "paga", "pago", "pagar", "pagamento", "quitei", "mes", "recebi", "recebido", "ontem", "hoje", "pix", "debito", "dinheiro", "boleto", "cartao", "mae", "credito"]);
const NOMES = new Set(["maria", "luiz", "antonio", "marco", "marina", "pantaleao", "delma"]);
const tokens = s => norm(s).split(/[^a-z0-9]+/).filter(w => w.length >= 3 && !/^\d+$/.test(w) && !PALAVRAS_VAZIAS.has(w));
// Procura a conta fixa cujo nome aparece no texto (ex.: "pensão do luiz paga" -> "Pensão do Luiz Antônio").
// Precisa de pelo menos uma palavra que não seja só nome de pessoa. Empate = pergunta qual é.
function acharFixa(n, mes, tipo) {
  const ts = new Set(tokens(n));
  if (!ts.size) return null;
  const cands = S.finFixas.filter(f => f.tipo === tipo && ativaNoMes(f, mes));
  let top = 0, tops = [];
  for (const f of cands) {
    const hit = [...new Set(tokens(f.descricao))].filter(w => ts.has(w));
    if (!hit.some(w => !NOMES.has(w))) continue;
    if (hit.length > top) { top = hit.length; tops = [f]; } else if (hit.length === top) tops.push(f);
  }
  if (!tops.length) return null;
  if (tops.length > 1) return { ambiguas: tops };
  return { f: tops[0], jaPaga: !!pagFixa(tops[0], mes) };
}
function interpretar(txt, opts = {}) {
  let n = norm(txt).trim();
  if (!n) return null;
  if (/\?\s*$/.test(n) || /^(quanto|quantos|qual|quais|o que|oque|quando|tem |como|cade|resumo)/.test(n)) return { tipo: "pergunta", n };
  let data = hoje();
  if (temPalavra(n, "ontem")) data = hoje(-1);
  const md = n.match(/(^|\s)(\d{1,2})\/(\d{1,2})(\/\d{2,4})?(\s|$)/);
  if (md) { const y = hoje().slice(0, 4); data = `${y}-${md[3].padStart(2, "0")}-${md[2].padStart(2, "0")}`; n = n.replace(md[0], " "); }
  const mv = n.match(/(?:r\$\s*)?(\d{1,3}(?:\.\d{3})+(?:,\d{1,2})?|\d+(?:[.,]\d{1,2})?)/);
  let valor = 0;
  if (mv) { let vs = mv[1]; vs = vs.includes(",") ? vs.replace(/\./g, "").replace(",", ".") : (/^\d{1,3}(\.\d{3})+$/.test(vs) ? vs.replace(/\./g, "") : vs); valor = Number(vs); }
  const receita = /(^|\s)(recebi|ganhei|entrou|entrada|vendi|salario|pagamento recebido)(\s|$)/.test(n);
  const fx = opts.semFixa ? null : acharFixa(n, data.slice(0, 7), receita ? "receita" : "despesa");
  if (fx && fx.ambiguas) return { tipo: "ambigua", lista: fx.ambiguas, mes: data.slice(0, 7), valor, data };
  if (fx) return { tipo: "fixa", f: fx.f, mes: data.slice(0, 7), valor, data, jaPaga: fx.jaPaga };
  if (!mv) return { tipo: "erro", msg: "Não encontrei o valor nem uma conta fixa com esse nome. Escreva, por exemplo: mercado 85" };
  if (!(valor > 0)) return { tipo: "erro", msg: "O valor precisa ser maior que zero." };
  let forma = "Pix / débito";
  if (/cartao (da )?mae|(^|\s)mae(\s|$)/.test(n)) forma = "Cartão da mãe";
  else if (/(^|\s)(dinheiro|especie)(\s|$)/.test(n)) forma = "Dinheiro";
  else if (/boleto/.test(n)) forma = "Boleto";
  else if (/cartao|credito/.test(n)) forma = "Cartão próprio";
  const pessoa = temPalavra(n, "marina") ? "Marina" : temPalavra(n, "marco") ? "Marco" : pessoaPadrao();
  const categoria = receita ? (/salario/.test(n) ? "Salário / contrato" : "Renda extra") : (acharCat(n) || "Outros");
  return { tipo: "lanc", v: { pessoa, tipo: receita ? "receita" : "despesa", valor, categoria, data, mes: data.slice(0, 7), forma, descricao: String(txt).trim().slice(0, 80), criadoEm: hoje(), autor: S.user?.email || "demo", origem: "assistente" } };
}
function responder(n) {
  const m = hoje().slice(0, 7), mesRef = /mes passado/.test(n) ? somaMes(m, -1) : m;
  const casal = /(^|\s)(nos|casal|a gente|casa|familia)(\s|\?|$)/.test(n);
  const p = temPalavra(n, "marina") ? "Marina" : temPalavra(n, "marco") ? "Marco" : pessoaPadrao();
  const quem = casal ? PESSOAS_FIN : [p], rot = casal ? "o casal" : p;
  const rs = quem.map(x => resumoPessoa(x, mesRef));
  const rm = rotuloMes(mesRef);
  if (/cartao|(^|\s)mae(\s|\?|$)/.test(n)) {
    const tot = soma(rs.map(r => r.cartaoMae));
    const div = soma(S.finSaldos.filter(s => s.tipo === "Dívida" && /mae/.test(norm(s.nome))).map(s => s.valor));
    return `Em ${rm}, ${rot} lançou ${brl2(tot)} no cartão da mãe. Saldo a devolver registrado em Saldos e dívidas: ${brl2(div)}.`;
  }
  if (/falta pagar|a pagar|vence|vencimento|pendente|contas do mes/.test(n)) {
    const pend = S.finFixas.filter(f => quem.includes(f.pessoa) && f.tipo === "despesa" && ativaNoMes(f, m) && !pagFixa(f, m)).sort((a, b) => (a.dia || 99) - (b.dia || 99));
    if (!pend.length) return `Nenhuma conta fixa pendente em ${rotuloMes(m)} para ${rot}.`;
    return `Faltam ${pend.length} contas (${brl2(soma(pend.map(f => f.valor)))}): ` + pend.map(f => `${f.descricao} ${brl2(f.valor)}${f.dia ? ` (dia ${f.dia})` : ""}`).join("; ") + ".";
  }
  if (/projeto|caixa/.test(n)) {
    const sc = S.caixa.reduce((a, c) => a + (c.tipo === "entrada" ? 1 : -1) * Number(c.valor || 0), 0);
    return `O Caixa do projeto tem ${brl2(sc)}.`;
  }
  if (/sobra|saldo|sobrou|quanto tenho|resumo/.test(n)) {
    const renda = soma(rs.map(r => r.renda)), desp = soma(rs.map(r => r.desp));
    return `Em ${rm}, ${rot}: entradas ${brl2(renda)}, saídas previstas ${brl2(desp)}, sobra ${brl2(renda - desp)}.`;
  }
  const cat = acharCat(n) || CAT_DESP.find(c => n.includes(norm(c)));
  if (/gast|paguei|despesa/.test(n) || cat) {
    if (cat) return `Em ${rm}, ${rot} tem ${brl2(soma(rs.map(r => r.porCat[cat] || 0)))} em ${cat}.`;
    return `Em ${rm}, ${rot} tem ${brl2(soma(rs.map(r => r.desp)))} de saídas (fixas ${brl2(soma(rs.map(r => r.despF)))}, dia a dia ${brl2(soma(rs.map(r => r.despV)))}).`;
  }
  return null;
}
function viewAssist() {

function bindAssist() {
  const f = $("#fA"); if (!f) return;
  const out = $("#aOut");
  const dizer = (txt, cls = "hint") => { out.innerHTML = ""; const p = document.createElement("p"); p.className = cls; p.textContent = txt; out.appendChild(p); return p; };
  f.addEventListener("submit", e => {
    e.preventDefault();
    const txt = $("#aTxt").value, r = interpretar(txt);
    if (!r) return;
    if (r.tipo === "erro") return dizer(r.msg);

      return dizer(resp || "Ainda não sei responder isso. Tente: quanto gastei com mercado? · o que falta pagar? · quanto sobra este mês? · cartão da mãe? Para conselhos e análises, use o botão Copiar resumo para o Claude, em Finanças → Conciliação.", resp ? "" : "hint");
    }

      const row = document.createElement("div"); row.className = "row"; row.style.marginTop = "8px";
      r.lista.forEach(f => { const b = document.createElement("button"); b.type = "button"; b.className = "btn sm ghost"; b.textContent = `${f.descricao} (${brl2(f.valor)})`; b.addEventListener("click", () => mostrarFixa({ f, mes: r.mes, valor: r.valor, data: r.data, jaPaga: !!pagFixa(f, r.mes) })); row.appendChild(b); });
      const novo = document.createElement("button"); novo.type = "button"; novo.className = "btn sm ghost"; novo.textContent = "Nenhuma: é um gasto diferente";
      novo.addEventListener("click", () => outroGasto()); row.appendChild(novo); out.appendChild(row);

    if (r.tipo === "fixa") return mostrarFixa(r);
    mostrarLanc(r.v);
  });
  function outroGasto() {
    const r2 = interpretar($("#aTxt").value, { semFixa: true }); out.innerHTML = "";
    if (r2 && r2.tipo === "lanc") mostrarLanc(r2.v); else dizer(r2 && r2.msg ? r2.msg : "Escreva também o valor, por exemplo: presente 50");
  }
  function mostrarFixa(r) {
    const f = r.f, desp = f.tipo === "despesa";
    if (r.jaPaga) return dizer(`A conta fixa "${f.descricao}" já está marcada como ${desp ? "paga" : "recebida"} em ${rotuloMes(r.mes)}. Nada foi lançado, para não contar duas vezes.`, "");
    const valor = r.valor || Number(f.valor) || 0;
    dizer(`Conta fixa "${f.descricao}" (${f.pessoa}): vou marcar como ${desp ? "paga" : "recebida"} em ${rotuloMes(r.mes)}, valor ${brl2(valor)}${valor !== Number(f.valor) ? ` (o cadastro diz ${brl2(f.valor)})` : ""}.`, "");
    const row = document.createElement("div"); row.className = "row"; row.style.marginTop = "8px";
    const ok = document.createElement("button"); ok.type = "button"; ok.className = "btn sm"; ok.textContent = desp ? "Marcar como paga" : "Marcar como recebida";
    const novo = document.createElement("button"); novo.type = "button"; novo.className = "btn sm ghost"; novo.textContent = "Não, é um gasto diferente";
    const no = document.createElement("button"); no.type = "button"; no.className = "btn sm ghost"; no.textContent = "Cancelar";
    row.append(ok, novo, no); out.appendChild(row);
    no.addEventListener("click", () => { out.innerHTML = ""; });
    novo.addEventListener("click", () => outroGasto());
    ok.addEventListener("click", async () => { ok.disabled = true; try { await addLanc({ fixaId: f.id, mes: r.mes, pessoa: f.pessoa, tipo: f.tipo, categoria: f.categoria, descricao: f.descricao, valor, data: r.data, forma: f.forma || "Pix / débito", criadoEm: hoje(), origem: "assistente" }); toast(desp ? "Conta marcada como paga." : "Marcada como recebida."); $("#aTxt").value = ""; out.innerHTML = ""; } catch (e) { ok.disabled = false; toast("Não foi possível salvar."); } });
  }
  function mostrarLanc(v) {
    const p = dizer(`Vou lançar: ${v.tipo === "receita" ? "entrada" : "saída"} de ${brl2(v.valor)} · ${v.categoria} · ${v.forma} · ${v.pessoa} · ${v.data.split("-").reverse().join("/")}.`, "");
    const row = document.createElement("div"); row.className = "row"; row.style.marginTop = "8px";
    const ok = document.createElement("button"); ok.type = "button"; ok.className = "btn sm"; ok.textContent = "Confirmar";
    const ed = document.createElement("button"); ed.type = "button"; ed.className = "btn sm ghost"; ed.textContent = "Corrigir categoria";
    const no = document.createElement("button"); no.type = "button"; no.className = "btn sm ghost"; no.textContent = "Cancelar";
    const sel = document.createElement("select"); sel.style.width = "auto"; sel.hidden = true; sel.setAttribute("aria-label", "Categoria");
    (v.tipo === "receita" ? CAT_REC : CAT_DESP).forEach(c => { const o = document.createElement("option"); o.textContent = c; if (c === v.categoria) o.selected = true; sel.appendChild(o); });
    row.append(ok, ed, sel, no); out.appendChild(row);
    ed.addEventListener("click", () => { sel.hidden = false; ed.hidden = true; sel.focus(); });
    sel.addEventListener("change", () => { v.categoria = sel.value; p.textContent = `Vou lançar: ${v.tipo === "receita" ? "entrada" : "saída"} de ${brl2(v.valor)} · ${v.categoria} · ${v.forma} · ${v.pessoa} · ${v.data.split("-").reverse().join("/")}.`; });
    no.addEventListener("click", () => { out.innerHTML = ""; });
    ok.addEventListener("click", async () => { ok.disabled = true; try { await addLanc(v); toast("Lançado."); $("#aTxt").value = ""; out.innerHTML = ""; } catch (err) { ok.disabled = false; toast("Não foi possível lançar."); } });
  }
}

/* ===================== backup ===================== */
function viewBackup() {
  const ub = S.sis?.ultimoBackup, ur = S.sis?.ultimaRevisao;
  const d = s => s ? esc(s.split("-").reverse().join("/")) : null;
  return `<div class="panel" style="margin-top:14px"><div class="row"><h2 style="margin:0">Segurança e backup</h2><span class="spacer"></span><button class="btn ghost" type="button" id="bkp">Baixar backup</button></div>
    <p class="hint" style="margin-top:8px">Último backup: ${d(ub) || "nunca"} · Última revisão de segurança: ${d(ur) || "pendente"}. O arquivo tem todos os dados, inclusive os financeiros: guarde num lugar só seu.</p></div>`;
}
function bindBackup() { const b = $("#bkp"); if (b) b.addEventListener("click", baixarBackup); }
async function baixarBackup() {
  const dados = { geradoEm: new Date().toISOString(), versao: VERSAO, tarefas: S.tarefas, caixa: S.caixa, plano: S.plano, financas: { config: S.finCfg, fixas: S.finFixas, lancamentos: S.finLanc, saldos: S.finSaldos } };
  const blob = new Blob([JSON.stringify(dados, null, 2)], { type: "application/json" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `backup-projeto-rural-${hoje()}.json`;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  const { id, ...resto } = S.sis || {};
  try { await DB.set("config", "sistema", { ...resto, ultimoBackup: hoje() }); } catch (e) {}
  toast("Backup baixado.");
}

/* ===================== inicialização ===================== */
function iniciarDados() {
  unsubs.forEach(u => u && u()); unsubs = [];
  unsubs.push(DB.sub("tarefas", l => { S.tarefas = l; if (S.tab !== "plano") render(); }));
  unsubs.push(DB.sub("caixa", l => { S.caixa = l; if (S.tab !== "plano") render(); }));
  unsubs.push(DB.sub("fin_fixas", l => { S.finFixas = l; if (S.tab !== "plano") render(); }));
  unsubs.push(DB.sub("fin_lanc", l => { S.finLanc = l; if (S.tab !== "plano") render(); }));
  unsubs.push(DB.sub("fin_saldos", l => { S.finSaldos = l; if (S.tab !== "plano") render(); }));
  unsubs.push(DB.sub("config", l => {
    const sis = l.find(x => x.id === "sistema"); S.sis = sis || {};
    const fc = l.find(x => x.id === "financas");
    S.finCfg = fc ? { ...FIN_PADRAO, ...fc } : { ...FIN_PADRAO };
    const d = l.find(x => x.id === "plano");
    const novo = d ? { ...PLANO_PADRAO, ...d, premissas: { ...PLANO_PADRAO.premissas, ...(d.premissas || {}) } } : PLANO_PADRAO;
    delete novo.id;
    const primeira = !S.plano;
    S.plano = novo;
    if (primeira || S.tab !== "plano") render();
  }));
}
function mostrarQuem() {
  const w = $("#who");
  if (DEMO) { w.innerHTML = `<span class="demo-flag">MODO DEMONSTRAÇÃO</span>`; return; }
  w.innerHTML = S.user ? `${esc(S.user.email)} <button class="btn ghost" id="sair" style="padding:4px 10px">Sair</button>` : "";
  const s = $("#sair"); if (s) s.addEventListener("click", () => firebase.auth().signOut());
}

(function boot() {
  const h = (location.hash || "").slice(1);
  if (["painel", "plano", "quadro", "caixa", "financas"].includes(h)) S.tab = h;
  document.querySelectorAll("#tabs button").forEach(b => b.setAttribute("aria-current", b.dataset.tab === S.tab ? "page" : "false"));
  if (!DEMO) firebase.initializeApp(FIREBASE_CONFIG);
  DB = criarDB();
  if (DEMO) { mostrarQuem(); iniciarDados(); return; }
  firebase.auth().onAuthStateChanged(u => {
    S.user = u; mostrarQuem();
    if (u) iniciarDados(); else { unsubs.forEach(x => x && x()); unsubs = []; S.plano = null; S.tarefas = []; S.caixa = []; render(); }
  });
})();
</script>
