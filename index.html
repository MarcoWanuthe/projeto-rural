<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Painel Projeto Rural</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: caderno de campo — barra superior com abas, conteúdo em largura confortável, quadro kanban com rolagem lateral */
:root{
  --bg:#F2F4EE; --surface:#FBFCF8; --sunk:#E8ECE2; --line:#D6DCCD; --fg:#1E2820; --muted:#5D6A5E;
  --accent:#36633A; --accent-soft:#E1EBDC; --ochre:#A97A1F; --ochre-soft:#F3E7C9;
  --good:#2F7A3B; --warn:#B07A12; --bad:#A63A24; --bad-soft:#F6E0DA;
  --f-display:"Familjen Grotesk",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141A15; --surface:#1B231C; --sunk:#111611; --line:#2F3A30; --fg:#E4EADF; --muted:#9AA799;
  --accent:#8CC48A; --accent-soft:#233325; --ochre:#E0B657; --ochre-soft:#3A3120;
  --good:#7CCB86; --warn:#E3B04F; --bad:#F08B70; --bad-soft:#3A221C; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body);padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px}
.brand{font:700 1.05rem var(--f-display);display:flex;align-items:center;gap:8px}
.brand i{width:10px;height:10px;border-radius:50%;background:var(--ochre);display:inline-block}
nav.tabs{display:flex;gap:4px;flex:1 1 auto;overflow-x:auto}
nav.tabs button{background:none;border:0;border-radius:6px;padding:7px 12px;font:600 .92rem var(--f-display);color:var(--muted);cursor:pointer;white-space:nowrap}
nav.tabs button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.who{font-size:.85rem;color:var(--muted);display:flex;align-items:center;gap:8px}
.demo-flag{font:500 .72rem var(--f-mono);background:var(--ochre-soft);color:var(--ochre);padding:3px 8px;border-radius:4px}
main{padding-block:22px 60px}
h1{font:700 1.6rem/1.2 var(--f-display);margin:0 0 4px;letter-spacing:-.01em;text-wrap:balance}
h2{font:700 1.15rem/1.25 var(--f-display);margin:0 0 10px;text-wrap:balance}
h3{font:600 1rem var(--f-display);margin:0 0 6px}
.lead{color:var(--muted);margin:0 0 18px;max-width:70ch}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.stat .k{font:500 .75rem var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.stat .v{font:700 1.5rem var(--f-display);margin-top:4px;font-variant-numeric:tabular-nums}
.stat .s{font-size:.85rem;color:var(--muted)}
.neg{color:var(--bad)} .pos{color:var(--good)}
.alerts{display:grid;gap:8px}
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:8px;background:var(--sunk);font-size:.92rem}
.alert b.dot{width:8px;height:8px;border-radius:50%;flex:0 0 8px;margin-top:7px;background:var(--warn)}
.alert.bad b.dot{background:var(--bad)} .alert.ok b.dot{background:var(--good)}
.btn{background:var(--accent);color:var(--surface);border:0;border-radius:7px;padding:8px 14px;font:600 .92rem var(--f-display);cursor:pointer}
.btn.ghost{background:none;color:var(--accent);border:1px solid var(--line)}
.btn.danger{background:none;color:var(--bad);border:1px solid var(--line)}
.btn:focus-visible,nav.tabs button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
input[type=text],input[type=number],input[type=date],input[type=month],input[type=email],input[type=password],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%}
textarea{min-height:70px;resize:vertical}
label.f{display:grid;gap:4px;font-size:.85rem;color:var(--muted)}
label.f span{font-weight:700;color:var(--fg)}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
/* Plano */
.fase{display:grid;grid-template-columns:minmax(150px,220px) 1fr;gap:14px;padding:14px 0;border-top:1px solid var(--line)}
.fase:first-of-type{border-top:0}
.fase .n{font:600 1rem var(--f-display)} .fase .d{font-size:.85rem;color:var(--muted)}
.fase.atual{background:var(--accent-soft);border-radius:8px;padding:14px;border:0}
.pill{display:inline-block;font:600 .72rem var(--f-display);padding:2px 8px;border-radius:99px;background:var(--sunk);color:var(--muted)}
.pill.on{background:var(--accent);color:var(--surface)}
.gate{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:4px}
.gate label{display:flex;gap:8px;align-items:flex-start;font-size:.92rem;cursor:pointer}
.gate input{margin-top:4px}
@media (max-width:640px){.fase{grid-template-columns:1fr}}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:.85rem;font-variant-numeric:tabular-nums}
th,td{padding:7px 9px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font:600 .78rem var(--f-display);color:var(--muted);background:var(--sunk);position:sticky;top:0}
td:first-child,th:first-child{text-align:left}
tr.hl td{background:var(--ochre-soft)}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:.82rem;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
/* Quadro */
.board{display:grid;grid-template-columns:repeat(4,minmax(250px,1fr));gap:12px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--sunk);border-radius:10px;padding:10px;min-height:200px;display:flex;flex-direction:column;gap:8px}
.col.drop{outline:2px dashed var(--accent);outline-offset:-4px}
.col h3{display:flex;justify-content:space-between;font-size:.92rem;margin:2px 4px 4px}
.col h3 small{font:500 .78rem var(--f-mono);color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;cursor:grab;display:grid;gap:6px}
.card .t{font-weight:700;line-height:1.3}
.card .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:.78rem}
.tag{padding:1px 7px;border-radius:4px;background:var(--sunk);color:var(--muted);font-weight:700}
.tag.Operacional{background:#E3ECD9;color:#3D5B22}.tag.Comercial{background:#F3E7C9;color:#7A5712}.tag.Regularização{background:#E2E5F1;color:#3C4775}.tag.Financeiro{background:#F0DFDA;color:#7E3A26}.tag.Gestão{background:#E6E6E0;color:#4B4B40}
@media (prefers-color-scheme:dark){.tag.Operacional{background:#27351F;color:#B6D69A}.tag.Comercial{background:#3A3120;color:#E8C77E}.tag.Regularização{background:#252A3E;color:#AEB8E6}.tag.Financeiro{background:#3A241E;color:#F0A88F}.tag.Gestão{background:#2C2C27;color:#C9C9BC}}
.due{color:var(--muted)} .due.late{color:var(--bad);font-weight:700}
.resp{margin-left:auto;font-weight:700;color:var(--accent)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filters select{width:auto}
/* Caixa */
.ent{color:var(--good)} .sai{color:var(--bad)}
td .x{background:none;border:0;color:var(--muted);cursor:pointer;font-size:1rem}
/* Modal */
dialog{border:0;border-radius:12px;padding:0;max-width:560px;width:calc(100% - 32px);background:var(--surface);color:var(--fg)}
dialog::backdrop{background:rgba(10,15,10,.45)}
dialog form{padding:18px;display:grid;gap:12px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:.9rem;z-index:50}
/* Login */
.login{max-width:380px;margin:12vh auto;display:grid;gap:12px}
.empty{padding:24px;text-align:center;color:var(--muted)}
.hint{font-size:.82rem;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<header class="top">
  <div class="wrap">
    <div class="brand"><i></i>Projeto Rural</div>
    <nav class="tabs" id="tabs" aria-label="Seções">

<main class="wrap" id="app"></main>

<dialog id="dlg"></dialog>

<!-- Firebase (versão compat, a mesma família usada no MESO-LOG) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* ===================================================================
   1) CONFIGURAÇÃO — cole aqui o objeto do seu projeto Firebase.
   Enquanto apiKey for "COLE_AQUI", o painel roda em MODO DEMONSTRAÇÃO:
   tudo fica salvo só neste navegador (localStorage).
   =================================================================== */
const FIREBASE_CONFIG = {
  apiKey: "COLE_AQUI",
  authDomain: "",
  projectId: "",
  storageBucket: "",
  messagingSenderId: "",
  appId: ""
};
const VERSAO = "v1-2026-11-04";

/* ===================== utilidades ===================== */
const DEMO = !FIREBASE_CONFIG.apiKey || FIREBASE_CONFIG.apiKey === "COLE_AQUI" || typeof firebase === "undefined";
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const brl = n => (Number(n) || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL", maximumFractionDigits: 0 });
const brl2 = n => (Number(n) || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
const num = (n, d = 0) => (Number(n) || 0).toLocaleString("pt-BR", { maximumFractionDigits: d, minimumFractionDigits: d });
const hoje = () => new Date().toISOString().slice(0, 10);
const MESES = ["jan", "fev", "mar", "abr", "mai", "jun", "jul", "ago", "set", "out", "nov", "dez"];
const rotuloMes = ym => { const [y, m] = ym.split("-").map(Number); return `${MESES[m - 1]}/${String(y).slice(2)}`; };
const somaMes = (ym, k) => { let [y, m] = ym.split("-").map(Number); m += k; y += Math.floor((m - 1) / 12); m = ((m - 1) % 12 + 12) % 12 + 1; return `${y}-${String(m).padStart(2, "0")}`; };
function toast(msg) { const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); }

/* ===================== camada de dados ===================== */
function criarDB() {
  if (DEMO) {
    const KEY = "projeto-rural-demo-v1";
    let data; try { data = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { data = {}; }
    const subs = {};
    const save = () => { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {} };
    const list = c => Object.entries(data[c] || {}).map(([id, v]) => ({ id, ...v }));
    const emit = c => (subs[c] || []).forEach(fn => fn(list(c)));
    return {
      sub(c, fn) { (subs[c] = subs[c] || []).push(fn); fn(list(c)); return () => { subs[c] = subs[c].filter(f => f !== fn); }; },
      async add(c, v) { const id = Math.random().toString(36).slice(2, 11); (data[c] = data[c] || {})[id] = v; save(); emit(c); return id; },
      async set(c, id, v) { (data[c] = data[c] || {})[id] = v; save(); emit(c); },
      async update(c, id, v) { data[c][id] = { ...data[c][id], ...v }; save(); emit(c); },
      async remove(c, id) { delete (data[c] || {})[id]; save(); emit(c); },
      async batchAdd(c, arr) { for (const v of arr) { const id = Math.random().toString(36).slice(2, 11); (data[c] = data[c] || {})[id] = v; } save(); emit(c); }
    };
  }
  const fs = firebase.firestore();
  return {
    sub(c, fn) { return fs.collection(c).limit(2000).onSnapshot(s => fn(s.docs.map(d => ({ id: d.id, ...d.data() }))), e => toast("Sem acesso aos dados: " + e.code)); },
    async add(c, v) { return (await fs.collection(c).add(v)).id; },
    async set(c, id, v) { await fs.collection(c).doc(id).set(v); },
    async update(c, id, v) { await fs.collection(c).doc(id).update(v); },
    async remove(c, id) { await fs.collection(c).doc(id).delete(); },
    async batchAdd(c, arr) { const b = fs.batch(); arr.forEach(v => b.set(fs.collection(c).doc(), v)); await b.commit(); }
  };
}

/* ===================== conteúdo inicial ===================== */
const PLANO_PADRAO = {
  faseAtual: "f0",
  fases: [
    { id: "f0", nome: "Fase 0 · Base", datas: "nov/2026 – jan/2027", resumo: "Orçamento organizado, reserva separada, acordo escrito com os sogros, consultas à Agrodefesa e à Emater, pesquisa de preço.",
      portao: [{ t: "Orçamento do casal positivo por 2 meses seguidos", ok: false }, { t: "Reserva de R$ 5 mil separada em conta própria", ok: false }, { t: "Acordo de sociedade escrito com os sogros", ok: false }, { t: "Preço de venda do ovo validado em Brasília", ok: false }, { t: "Resposta da Agrodefesa sobre venda direta de ovos", ok: false }] },
    { id: "f1", nome: "Fase 1 · Piloto", datas: "fev – set/2027", resumo: "100 aves, galinheiro simples, esterco para a compostagem da horta, registro diário de produção e vendas.",
      portao: [{ t: "Postura média ≥ 65% por 3 meses", ok: false }, { t: "≥ 95% da produção vendida", ok: false }, { t: "Margem ≥ R$ 14 por ave/mês", ok: false }, { t: "≥ 25 clientes com compra recorrente", ok: false }] },
    { id: "f2", nome: "Fase 2 · Validar", datas: "out/2027 – jun/2028", resumo: "Ampliar para ≈ 300 aves, hortaliças na mesma entrega, CAF, OCS de orgânicos e inspeção para vender a mercados do DF.",
      portao: [{ t: "Lucro rural ≥ 50% do custo de vida da casa por 6 meses", ok: false }, { t: "Reserva de 3 meses de custo de vida", ok: false }, { t: "Inspeção sanitária resolvida para mercados e restaurantes", ok: false }] },
    { id: "f3", nome: "Fase 3 · Escala", datas: "jul/2028 – 2029", resumo: "Mais aves, agrofloresta, crédito PRONAF no nome da Marina ou da unidade familiar, mudança para a propriedade, redução negociada do contrato PJ.",
      portao: [{ t: "Lucro rural ≥ R$ 8 mil/mês por 6 meses", ok: false }, { t: "Reserva de 6 meses de custo de vida", ok: false }, { t: "Pelo menos 2 atividades gerando receita", ok: false }] },
    { id: "f4", nome: "Fase 4 · Transição", datas: "a partir de 2029/2030", resumo: "Dedicação integral. Nova atividade só entra depois de bater a meta da anterior.", portao: [] }
  ],
  premissas: {
    inicio: "2026-11", rendaCasal: 6798, despesasCasa: 5260, reservaInicial: 5000, reservaMeses: 3, capitalProjeto: 5000,
    pctReserva: 30, postura: 65, preco: 15, racaoKg: 1.8, consumoG: 115, mortalidade: 6, sanidadeAve: 1, embalagemDz: 0.6,
    transporteMes: 250, pintainha: 8, recriaKg: 7, mesesRecria: 5, instalacaoAve: 30, pctSogros: 30, metaRenda: 8000
  },
  lotes: [{ mes: "2027-02", qtd: 100 }, { mes: "2027-11", qtd: 200 }],
  anos: [{ ano: 1, aves: 100, outras: 0 }, { ano: 2, aves: 300, outras: 500 }, { ano: 3, aves: 450, outras: 1500 }, { ano: 4, aves: 700, outras: 3000 }, { ano: 5, aves: 1000, outras: 4500 }]
};

const TAREFAS_INICIAIS = [
  ["Separar R$ 5 mil de reserva em conta própria", "Marina", "Financeiro", "2026-11-10", "Conta separada, de preferência no nome da Marina. Não usar para o projeto."],
  ["Publicar o painel e criar o acesso da Marina", "Marco", "Gestão", "2026-11-08", "Seguir o LEIA-ME: Firebase, regras, GitHub Pages."],
  ["Ligar para a Agrodefesa", "Marco", "Regularização", "2026-11-13", "Perguntas: venda direta de ovos a pessoa física exige registro? A venda de ovos com SIE para o DF segue autorizada? Telefone (62) 3201-8578 · geinsp.agrodefesa@goias.gov.br"],
  ["Pesquisa de preço do ovo caipira em 5 pontos de Brasília", "Marina", "Comercial", "2026-11-18", "Feira orgânica, hortifrúti, empório, supermercado e venda por WhatsApp. Anotar preço da dúzia, marca e se é orgânico."],
  ["Visitar a Emater-GO", "Marco", "Regularização", "2026-11-21", "CAF, assistência técnica e projeto do galinheiro."],
  ["Conversar com a cooperativa do assentamento", "Pantaleão", "Regularização", "2026-11-22", "Existe OCS de orgânicos? Vendem para PAA ou PNAE? Como entrar?"],
  ["Conversa com os sogros sobre a sociedade", "Casal", "Gestão", "2026-11-22", "Levar a proposta: quem faz o quê, como dividir custos e resultado, uso da área do galinheiro."],
  ["Lista de 30 possíveis clientes", "Marina", "Comercial", "2026-11-25", "Família, colegas, clínicas, vizinhos de Brasília. Nome, contato e quantas dúzias por semana."],
  ["Verificar cláusulas no título da terra", "Marco", "Regularização", "2026-11-30", "Olhar na matrícula se há cláusula de inalienabilidade e até quando vale."],
  ["Rascunho do acordo de sociedade", "Marco", "Gestão", "2026-11-30", "Depois da conversa com os sogros. Registrar divisão de trabalho, custos e resultado."],
  ["Cortar R$ 400 de gastos aleatórios", "Casal", "Financeiro", "2026-11-30", "Acompanhar no fim do mês se o corte aconteceu."],
  ["Decidir o que fazer com o consórcio Porto Seguro", "Marco", "Financeiro", "2026-11-30", "Entender o bem, o prazo e se faz sentido manter, transferir ou vender a cota."],
  ["Definir o local do galinheiro e medir a água na seca", "Marco", "Operacional", "2026-12-13", "Perto de energia e água, longe de alagamento, com área para piquete."],
  ["Orçar galinheiro para 100 aves", "Marco", "Operacional", "2026-12-20", "Materiais, tela, comedouros, bebedouros, ninhos (1 para cada 5 aves)."]
].map(([titulo, responsavel, area, prazo, descricao], i) => ({ titulo, responsavel, area, prazo, descricao, status: "afazer", fase: "f0", ordem: i, criadoEm: hoje() }));

const COLUNAS = [["afazer", "A fazer"], ["fazendo", "Fazendo"], ["aguardando", "Aguardando terceiros"], ["feito", "Feito"]];
const AREAS = ["Operacional", "Comercial", "Regularização", "Financeiro", "Gestão"];
const PESSOAS = ["Marco", "Marina", "Casal", "Pantaleão", "Delma"];
const CATEGORIAS = { entrada: ["Venda de ovos", "Venda de hortaliças", "Venda de aves", "Aporte do casal", "Outras entradas"], saida: ["Ração", "Aves", "Instalações", "Equipamentos", "Sanidade", "Embalagem", "Transporte", "Repasse aos sogros", "Documentação", "Outras saídas"] };
const ATIVIDADES = ["Avicultura", "Horta", "Geral"];

/* ===================== projeção ===================== */
function projetar(plano) {
  const P = plano.premissas, out = [];
  const [y0, m0] = P.inicio.split("-").map(Number);
  const idx = s => { const [y, m] = s.split("-").map(Number); return (y - y0) * 12 + (m - m0); };
  const lotes = (plano.lotes || []).filter(l => l.mes && l.qtd > 0).map(l => ({ ...l, i: idx(l.mes) }));
  const metaReserva = P.despesasCasa * P.reservaMeses;
  let caixa = P.capitalProjeto, reserva = P.reservaInicial;
  for (let i = 0; i < 24; i++) {
    let aves = 0, invest = 0, recria = 0;
    for (const l of lotes) {
      if (i === l.i) invest += l.qtd * (P.pintainha + P.instalacaoAve);
      if (i >= l.i && i < l.i + P.mesesRecria) recria += l.qtd * P.recriaKg * P.racaoKg / P.mesesRecria;
      if (i >= l.i + P.mesesRecria) aves += l.qtd * (1 - P.mortalidade / 100);
    }
    const dz = aves * 30 * (P.postura / 100) / 12;
    const receita = dz * P.preco;
    const custo = aves * (P.consumoG / 1000 * 30 * P.racaoKg + P.sanidadeAve) + dz * P.embalagemDz + (aves > 0 ? P.transporteMes : 0) + recria;
    const resultado = receita - custo;
    const sogros = resultado > 0 ? resultado * P.pctSogros / 100 : 0;
    const liquido = resultado - sogros;
    const sobra = P.rendaCasal - P.despesasCasa;
    const paraReserva = sobra > 0 && reserva < metaReserva ? Math.min(sobra * P.pctReserva / 100, metaReserva - reserva) : 0;
    const aporte = sobra - paraReserva;
    reserva += paraReserva;
    caixa += aporte + liquido - invest;
    out.push({ mes: somaMes(P.inicio, i), aves, dz, receita, custo, resultado, sogros, liquido, invest, aporte, caixa, reserva });
  }
  return out;
}
function margemPorAve(P) {
  const dzAve = 30 * (P.postura / 100) / 12;
  return dzAve * P.preco - (P.consumoG / 1000 * 30 * P.racaoKg + P.sanidadeAve) - dzAve * P.embalagemDz;
}
function visao5anos(plano) {
  const P = plano.premissas, m = margemPorAve(P);
  return (plano.anos || []).map(a => {
    const vivos = a.aves * (1 - P.mortalidade / 100);
    const bruto = vivos * m - (a.aves > 0 ? P.transporteMes * Math.max(1, Math.ceil(a.aves / 400)) : 0) + Number(a.outras || 0);
    const casal = bruto > 0 ? bruto * (1 - P.pctSogros / 100) : bruto;
    return { ...a, porMes: casal, porAno: casal * 12, atinge: casal >= P.metaRenda };
  });
}

function graficoCaixa(proj) {
  const W = 760, H = 240, L = 64, R = 16, T = 16, B = 34;
  const vals = proj.flatMap(r => [r.caixa, r.reserva, r.liquido]);
  let lo = Math.min(0, ...vals), hi = Math.max(...vals); if (hi === lo) hi = lo + 1;
  const step = Math.pow(10, Math.floor(Math.log10((hi - lo) / 4)));
  const nice = [1, 2, 2.5, 5, 10].map(k => k * step).find(s => (hi - lo) / s <= 5) || step * 10;
  lo = Math.floor(lo / nice) * nice; hi = Math.ceil(hi / nice) * nice;
  const X = i => L + i * (W - L - R) / (proj.length - 1), Y = v => T + (hi - v) * (H - T - B) / (hi - lo);
  const line = (k, c, w) => `<polyline fill="none" stroke="${c}" stroke-width="${w}" points="${proj.map((r, i) => `${X(i).toFixed(1)},${Y(r[k]).toFixed(1)}`).join(" ")}"/>`;
  let ticks = ""; for (let v = lo; v <= hi + 1e-6; v += nice) ticks += `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"${v === 0 ? ' stroke-width="1.5"' : ""}/><text x="${L - 8}" y="${Y(v) + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${(v / 1000).toLocaleString("pt-BR")} mil</text>`;
  const xl = proj.map((r, i) => i % 3 === 0 ? `<text x="${X(i)}" y="${H - 12}" text-anchor="middle" font-size="11" fill="var(--muted)">${rotuloMes(r.mes)}</text>` : "").join("");
  const last = proj.length - 1;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Caixa do projeto, reserva e renda rural nos próximos 24 meses">${ticks}${xl}${line("reserva", "var(--ochre)", 2)}${line("liquido", "var(--muted)", 1.5)}${line("caixa", "var(--accent)", 2.5)}<circle cx="${X(last)}" cy="${Y(proj[last].caixa)}" r="4" fill="var(--accent)"/></svg>`;
}

function bindQuadro() {
  $("#novaT").addEventListener("click", () => abrirTarefa(null));
  const s = $("#seed2"); if (s) s.addEventListener("click", seedTarefas);
  $("#fResp").addEventListener("change", e => { S.filtroResp = e.target.value; render(); });
  $("#fArea").addEventListener("change", e => { S.filtroArea = e.target.value; render(); });
  document.querySelectorAll(".card").forEach(c => {
    c.addEventListener("click", () => abrirTarefa(c.dataset.id));
    c.addEventListener("keydown", e => { if (e.key === "Enter") abrirTarefa(c.dataset.id); });
    c.addEventListener("dragstart", e => { e.dataTransfer.setData("text/plain", c.dataset.id); e.dataTransfer.effectAllowed = "move"; });
  });
  document.querySelectorAll(".col").forEach(col => {
    col.addEventListener("dragover", e => { e.preventDefault(); col.classList.add("drop"); });
    col.addEventListener("dragleave", () => col.classList.remove("drop"));
    col.addEventListener("drop", async e => {
      e.preventDefault(); col.classList.remove("drop");
      const id = e.dataTransfer.getData("text/plain"), st = col.dataset.col;
      const t = S.tarefas.find(x => x.id === id); if (!t || t.status === st) return;
      t.status = st; render();
      try { await DB.update("tarefas", id, { status: st, atualizadoEm: hoje(), ...(st === "feito" ? { concluidoEm: hoje() } : {}) }); } catch (err) { toast("Não foi possível mover a tarefa."); }
    });
  });
}
function abrirTarefa(id) {
  const t = id ? S.tarefas.find(x => x.id === id) : { titulo: "", descricao: "", responsavel: "Marco", area: "Operacional", prazo: "", status: "afazer", fase: S.plano.faseAtual };
  if (!t) return;
  const dlg = $("#dlg");
  dlg.innerHTML = `<form method="dialog" id="fT">
    <h2>${id ? "Editar tarefa" : "Nova tarefa"}</h2>
    <label class="f"><span>Título</span><input type="text" id="tTit" required value="${esc(t.titulo)}"></label>
    <label class="f"><span>Detalhes</span><textarea id="tDesc">${esc(t.descricao)}</textarea></label>
    <div class="form-grid">
      <label class="f"><span>Responsável</span><select id="tResp">${PESSOAS.map(p => `<option ${t.responsavel === p ? "selected" : ""}>${p}</option>`).join("")}</select></label>
      <label class="f"><span>Área</span><select id="tArea">${AREAS.map(a => `<option ${t.area === a ? "selected" : ""}>${a}</option>`).join("")}</select></label>
      <label class="f"><span>Prazo</span><input type="date" id="tPrazo" value="${esc(t.prazo)}"></label>
      <label class="f"><span>Status</span><select id="tSt">${COLUNAS.map(([k, n]) => `<option value="${k}" ${t.status === k ? "selected" : ""}>${n}</option>`).join("")}</select></label>
      <label class="f"><span>Fase</span><select id="tFase">${S.plano.fases.map(f => `<option value="${f.id}" ${t.fase === f.id ? "selected" : ""}>${esc(f.nome)}</option>`).join("")}</select></label>
    </div>
    <div class="row">${id ? `<button type="button" class="btn danger" id="tDel">Excluir</button>` : ""}<span class="spacer"></span><button type="button" class="btn ghost" id="tCancel">Cancelar</button><button class="btn" type="submit">Salvar</button></div>
    <div class="row" id="tConfirm" hidden><span class="neg">Excluir esta tarefa de vez?</span><span class="spacer"></span><button type="button" class="btn ghost" id="tNo">Não</button><button type="button" class="btn danger" id="tYes">Sim, excluir</button></div>
  </form>`;
  dlg.showModal();
  $("#tCancel").addEventListener("click", () => dlg.close());
  if (id) {
    $("#tDel").addEventListener("click", () => { $("#tConfirm").hidden = false; });
    $("#tNo").addEventListener("click", () => { $("#tConfirm").hidden = true; });
    $("#tYes").addEventListener("click", async () => { dlg.close(); try { await DB.remove("tarefas", id); toast("Tarefa excluída."); } catch (e) { toast("Não foi possível excluir."); } });
  }
  $("#fT").addEventListener("submit", async e => {
    e.preventDefault();
    const v = { titulo: $("#tTit").value.trim(), descricao: $("#tDesc").value.trim(), responsavel: $("#tResp").value, area: $("#tArea").value, prazo: $("#tPrazo").value, status: $("#tSt").value, fase: $("#tFase").value, atualizadoEm: hoje() };
    if (!v.titulo) return;
    if (v.status === "feito" && t.status !== "feito") v.concluidoEm = hoje();
    dlg.close();
    try { if (id) await DB.update("tarefas", id, v); else await DB.add("tarefas", { ...v, criadoEm: hoje() }); toast("Tarefa salva."); } catch (err) { toast("Não foi possível salvar a tarefa."); }
  });
}

/* ===================== caixa ===================== */
function viewCaixa() {
  const mes = S.mesCaixa;
  const doMes = S.caixa.filter(c => (c.data || "").startsWith(mes)).sort((a, b) => a.data < b.data ? 1 : -1);
  const tot = t => doMes.filter(c => c.tipo === t).reduce((a, c) => a + Number(c.valor || 0), 0);
  const ent = tot("entrada"), sai = tot("saida");
  const porCat = {};
  doMes.filter(c => c.tipo === "saida").forEach(c => porCat[c.categoria] = (porCat[c.categoria] || 0) + Number(c.valor || 0));
  const saldo = S.caixa.reduce((a, c) => a + (c.tipo === "entrada" ? 1 : -1) * Number(c.valor || 0), 0);
  const invest = S.caixa.filter(c => c.tipo === "saida" && ["Aves", "Instalações", "Equipamentos"].includes(c.categoria)).reduce((a, c) => a + Number(c.valor || 0), 0);
  return `
  <div class="row"><div><h1>Caixa do projeto</h1><p class="lead" style="margin:0">Só o dinheiro do rural. As contas da casa ficam fora daqui; o que a casa coloca no projeto entra como "Aporte do casal".</p></div><span class="spacer"></span></div>
  <div class="grid g4" style="margin-top:14px">
    <div class="panel stat"><div class="k">Entradas no mês</div><div class="v pos">${brl(ent)}</div></div>
    <div class="panel stat"><div class="k">Saídas no mês</div><div class="v neg">${brl(sai)}</div></div>
    <div class="panel stat"><div class="k">Saldo do projeto</div><div class="v ${saldo < 0 ? "neg" : ""}">${brl(saldo)}</div></div>
    <div class="panel stat"><div class="k">Investido até hoje</div><div class="v">${brl(invest)}</div><div class="s">Aves, instalações e equipamentos</div></div>
  </div>
  <div class="grid g2" style="margin-top:14px">
    <form class="panel" id="fC"><h2>Novo lançamento</h2>
      <div class="form-grid">
        <label class="f"><span>Tipo</span><select id="cTipo"><option value="saida">Saída</option><option value="entrada">Entrada</option></select></label>
        <label class="f"><span>Data</span><input type="date" id="cData" value="${hoje()}" required></label>
        <label class="f"><span>Valor (R$)</span><input type="number" id="cValor" step="0.01" min="0" required></label>
        <label class="f"><span>Categoria</span><select id="cCat">${CATEGORIAS.saida.map(c => `<option>${c}</option>`).join("")}</select></label>
        <label class="f"><span>Atividade</span><select id="cAtv">${ATIVIDADES.map(a => `<option>${a}</option>`).join("")}</select></label>
      </div>
      <label class="f" style="margin-top:12px"><span>Descrição</span><input type="text" id="cDesc" placeholder="Ex.: 2 sacos de ração 40 kg"></label>
      <div class="row" style="margin-top:12px"><button class="btn" type="submit">Lançar</button></div>
    </form>
    <div class="panel"><h2>Saídas do mês por categoria</h2>
      ${Object.keys(porCat).length ? `<div class="tbl-wrap"><table><tbody>${Object.entries(porCat).sort((a, b) => b[1] - a[1]).map(([k, v]) => `<tr><td>${esc(k)}</td><td>${brl2(v)}</td><td>${num(v / sai * 100)}%</td></tr>`).join("")}</tbody></table></div>` : `<div class="empty">Nenhuma saída neste mês.</div>`}
    </div>
  </div>
  <div class="panel" style="margin-top:14px">
    <div class="row"><h2 style="margin:0">Lançamentos</h2><span class="spacer"></span><label class="f" style="grid-template-columns:auto auto;align-items:center"><span>Mês</span><input type="month" id="cMes" value="${mes}"></label></div>
    ${doMes.length ? `<div class="tbl-wrap" style="margin-top:10px"><table><thead><tr><th>Data</th><th>Descrição</th><th>Categoria</th><th>Atividade</th><th>Valor</th><th></th></tr></thead><tbody>
      ${doMes.map(c => `<tr><td>${esc(c.data.split("-").reverse().join("/"))}</td><td style="text-align:left">${esc(c.descricao || "—")}</td><td style="text-align:left">${esc(c.categoria)}</td><td style="text-align:left">${esc(c.atividade)}</td><td class="${c.tipo === "entrada" ? "ent" : "sai"}">${c.tipo === "entrada" ? "+" : "−"} ${brl2(c.valor)}</td><td><button class="x" data-del="${c.id}" aria-label="Excluir lançamento">×</button></td></tr>`).join("")}
    </tbody></table></div>` : `<div class="empty">Nenhum lançamento em ${rotuloMes(mes)}.</div>`}
    <div class="row" id="cConfirm" hidden style="margin-top:10px"><span class="neg">Excluir este lançamento?</span><span class="spacer"></span><button class="btn ghost" id="cNo">Não</button><button class="btn danger" id="cYes">Sim, excluir</button></div>
  </div>`;
}
function bindCaixa() {
  const fillCat = () => { $("#cCat").innerHTML = CATEGORIAS[$("#cTipo").value].map(c => `<option>${c}</option>`).join(""); };
  $("#cTipo").addEventListener("change", fillCat);
  $("#cMes").addEventListener("change", e => { S.mesCaixa = e.target.value || hoje().slice(0, 7); render(); });
  $("#fC").addEventListener("submit", async e => {
    e.preventDefault();
    const v = { tipo: $("#cTipo").value, data: $("#cData").value, valor: Number($("#cValor").value), categoria: $("#cCat").value, atividade: $("#cAtv").value, descricao: $("#cDesc").value.trim(), criadoEm: hoje(), autor: S.user?.email || "demo" };
    if (!v.valor || !v.data) return;
    try { await DB.add("caixa", v); toast("Lançamento registrado."); } catch (err) { toast("Não foi possível lançar."); }
  });
  let alvo = null;
  document.querySelectorAll("[data-del]").forEach(b => b.addEventListener("click", () => { alvo = b.dataset.del; $("#cConfirm").hidden = false; }));
  const no = $("#cNo"), yes = $("#cYes");
  if (no) no.addEventListener("click", () => { alvo = null; $("#cConfirm").hidden = true; });
  if (yes) yes.addEventListener("click", async () => { if (!alvo) return; try { await DB.remove("caixa", alvo); toast("Lançamento excluído."); } catch (e) { toast("Não foi possível excluir."); } });
}

/* ===================== inicialização ===================== */
function iniciarDados() {
  unsubs.forEach(u => u && u()); unsubs = [];
  unsubs.push(DB.sub("tarefas", l => { S.tarefas = l; if (S.tab !== "plano") render(); }));
  unsubs.push(DB.sub("caixa", l => { S.caixa = l; if (S.tab !== "plano") render(); }));
  unsubs.push(DB.sub("config", l => {
    const d = l.find(x => x.id === "plano");
    const novo = d ? { ...PLANO_PADRAO, ...d, premissas: { ...PLANO_PADRAO.premissas, ...(d.premissas || {}) } } : PLANO_PADRAO;
    delete novo.id;
    const primeira = !S.plano;
    S.plano = novo;
    if (primeira || S.tab !== "plano") render();
  }));
}
function mostrarQuem() {
  const w = $("#who");
  if (DEMO) { w.innerHTML = `<span class="demo-flag">MODO DEMONSTRAÇÃO</span>`; return; }
  w.innerHTML = S.user ? `${esc(S.user.email)} <button class="btn ghost" id="sair" style="padding:4px 10px">Sair</button>` : "";
  const s = $("#sair"); if (s) s.addEventListener("click", () => firebase.auth().signOut());
}

(function boot() {
  const h = (location.hash || "").slice(1);
  if (["painel", "plano", "quadro", "caixa"].includes(h)) S.tab = h;
  document.querySelectorAll("#tabs button").forEach(b => b.setAttribute("aria-current", b.dataset.tab === S.tab ? "page" : "false"));
  if (!DEMO) firebase.initializeApp(FIREBASE_CONFIG);
  DB = criarDB();
  if (DEMO) { mostrarQuem(); iniciarDados(); return; }
  firebase.auth().onAuthStateChanged(u => {
    S.user = u; mostrarQuem();
    if (u) iniciarDados(); else { unsubs.forEach(x => x && x()); unsubs = []; S.plano = null; S.tarefas = []; S.caixa = []; render(); }
  });
})();
</script>
</body>
</html>
